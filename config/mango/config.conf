# Kestrel user Mango configuration.
# Copied to ~/.config/mango/config.conf. Edit here, not the defaults.

# Kestrel defaults.
source=~/.local/share/kestrel/default/mango/config.conf

# Current theme overrides (colors, borders, blur).
source_optional=~/.local/share/kestrel/current/theme/mango.conf

# Personal overrides for this machine, ported from ~/.config/hypr/*.lua.
source_optional=~/.config/mango/input.conf
source_optional=~/.config/mango/looknfeel.conf
source_optional=~/.config/mango/monitors.conf

# Add your own Mango configuration below.
