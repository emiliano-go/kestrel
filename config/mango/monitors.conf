# Personal Mango monitors, ported from ~/.config/hypr/monitors.lua.
# Sourced after the Kestrel defaults, so these replace them.

# left to right
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitor_rule=name:^DP-3$,width:1920,height:1080,refresh:240,x:1920,y:0,scale:1
monitor_rule=name:^DP-2$,width:1366,height:768,refresh:59,x:3840,y:0,scale:1

# HDR for DP-3 is toggled at runtime with `mmsg dispatch togglehdr,on,DP-3`;
# the ported toggle-hdr command owns it (live monitors-hdr.lua carried bitdepth
# 10 + cm hdredid + sdrbrightness/sdrsaturation/sdr_eotf).
