# Personal Mango keybindings, ported from ~/.config/hypr/bindings.lua.
# Sourced after the Kestrel defaults. Mango has no unbind and rejects duplicate
# keys (unless both carry the `c` flag), so anything here must not repeat a
# default bind; the defaults this file replaces were removed from
# default/mango/bindings.conf.

# Scratchpad: Tag 0 tilable special overlay. The quake half-height drop is
# deferred, so this is the closest tiling equivalent.
bind=SUPER,Y,toggle_special_tag
bind=SUPER+SHIFT,Y,tag_special_silent

# Named special workspaces as extra tags (10-13) so they keep tiling.
bind=SUPER,S,view,10
bind=SUPER+SHIFT,S,tagsilent,10
bind=SUPER,M,view,11
bind=SUPER+SHIFT,M,tagsilent,11
bind=SUPER,A,view,12
bind=SUPER+SHIFT,A,tagsilent,12
bind=SUPER,R,view,13
bind=SUPER+SHIFT,R,spawn,kestrel-launch-webapp https://devdocs.io/
