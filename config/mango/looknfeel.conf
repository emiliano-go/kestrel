# Personal Mango appearance, ported from ~/.config/hypr/looknfeel.lua.
# Sourced after the Kestrel defaults, so these replace them.

# Gaps (live general.gaps_in/gaps_out 4/8).
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8

# Live pinned the active border to theme gray and disabled animations.
# M6 moves the border color into the per-theme mango.conf fragments.
focus_color=0x8a8a8dff
animations=0

# Zen never starts fullscreen or maximized (live window rule ^zen$).
window_rule=is_fullscreen:0,ignore_maximize:1,app_id:^zen$

# Extra tags 10-13 hold the named special workspaces (config/mango/bindings.conf),
# kept tiled like tags 1-9.
tag_num=13
tag_rule=id:10,layout_name:tile
tag_rule=id:11,layout_name:tile
tag_rule=id:12,layout_name:tile
tag_rule=id:13,layout_name:tile
