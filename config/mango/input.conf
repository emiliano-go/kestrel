# Personal Mango input, ported from ~/.config/hypr/input.lua.
# Sourced after the Kestrel defaults, so these replace them.

# Keyboard
xkb_rules_layout=es
xkb_rules_options=compose:caps,shift:both_capslock_cancel
repeat_rate=40
repeat_delay=600
numlock_on=1

# Mouse: Hyprland input:scroll_factor/accel_profile/sensitivity.
axis_scroll_factor=3
mouse_accel_profile=1
# Hyprland sensitivity is -1..1 but the live config pins 1.5; Mango caps
# accel_speed at 1.0, so this is the closest faithful value.
mouse_accel_speed=1.0

# Trackpad: live natural_scroll + scroll_factor 0.4.
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.4
trackpad_accel_profile=1

# Pen tablet pinned to DP-3 (live input.tablet.output).
device_rule=type:tablet,monitor:DP-3
