# Kestrel portable vault configuration. Read by `kestrel vault` (kestrel-vault).
#
# The vault is a LUKS2 container baked into the ISO (or carried on a partition).
# It is read-only at rest; unlocking mounts a device-mapper snapshot whose
# copy-on-write store holds the session's changes and is discarded on lock,
# reboot or removal. The encrypted container is never modified.

# Container to open. Empty = auto-detect: the live medium
# (/run/archiso/bootmnt/kestrel/vault.img) first, then any device labelled
# KESTREL_VAULT.
KESTREL_VAULT_CONTAINER=

# Where session changes live:
#   zram - compressed RAM. Finite (a fraction of RAM) but fast and leaves no
#          trace; survives nothing.
#   disk - a writable partition, wrapped in an ephemeral-key dm-crypt mapping so
#          removal/power-loss makes the leftover data unreadable. Unbounded.
KESTREL_VAULT_COW_BACKEND=zram

# zram COW sizing: the hard RAM ceiling (fraction of MemTotal) and the logical
# size multiplier that compression buys.
KESTREL_VAULT_COW_FRACTION=0.25
KESTREL_VAULT_COW_DISKSIZE_FACTOR=2

# Partition used when KESTREL_VAULT_COW_BACKEND=disk.
KESTREL_VAULT_DISK_COW_PART=/dev/disk/by-partlabel/KESTREL_VAULT_COW

# Where the unlocked vault is mounted.
KESTREL_VAULT_MOUNTPOINT=/run/kestrel/vault

# A convenience symlink in the invoking user's home. Empty = <home>/Vault.
KESTREL_VAULT_USER_LINK=
