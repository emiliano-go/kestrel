TARGET_OS_NAME="HeliOS"

# HeliOS keeps the bare kernel/systemd startup log visible instead of hiding it
# behind a Plymouth boot splash. The log-suppressing parameters omarchy shipped
# (quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0) are
# deliberately dropped. Plymouth stays installed so the LUKS unlock prompt keeps
# its themed background; see default/plymouth/helios.script.
KERNEL_CMDLINE[default]+=" initramfs_async=0"

CUSTOM_UKI_NAME="helios"
ENABLE_LIMINE_FALLBACK=yes

# Find and add other bootloaders
FIND_BOOTLOADERS=yes

# Keep T2 Macs on their specialized kernel; prefer linux-helios elsewhere.
BOOT_ORDER="linux-t2, linux-helios, linux-helios-*, *, *fallback, Snapshots"

# Snapper is configured with NUMBER_LIMIT="5" (see default/snapper/root), but
# limine-snapper-sync can see the newly created sixth snapshot before cleanup
# restores the retained snapshot count to 5. Allow for that creation window:
#   Snapshot limit mismatch: 6 Snapper snapshots exceed configured
#   MAX_SNAPSHOT_ENTRIES=5
MAX_SNAPSHOT_ENTRIES=6

SNAPSHOT_FORMAT_CHOICE=5
