# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Upstream Arch repositories are the base for everything except the packages
# Kestrel builds itself, served from the [kestrel] repository below.
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Repositories for debug symbol packages.
#
# These upstream debug packages match the core/extra/multilib packages above.
# You may not need to enable these repositories for many debugging tools --
# debuginfod will work fine without them.
#
# [core-debug]
# Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
#
# [extra-debug]
# Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
#
# [multilib-debug]
# Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# Kestrel's own packages: hyprland-kestrel, quickshell-kestrel, linux-kestrel.
# Distinct names that conflict with the Arch packages, so Arch cannot overwrite
# them. Signed with the Kestrel packaging key in /etc/pacman.d/kestrel.gpg.
[kestrel]
SigLevel = Required
Server = https://kestrel-distro.github.io/packages/
