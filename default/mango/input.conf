# Kestrel default Mango input, translated from the Hyprland defaults.

# Keyboard
repeat_rate=40
repeat_delay=250
numlock_on=1
xkb_rules_layout=us

# Trackpad
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0

# Mouse
mouse_natural_scrolling=0
