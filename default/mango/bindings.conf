# Kestrel default Mango keybindings, translated from the Hyprland defaults.
# Syntax: bind[flags]=MODIFIERS,KEY,DISPATCHER,PARAMETERS
# Flags: l (locked), s (keysym), r (release), p (pass through), c (allow conflict)
#
# No direct Mango equivalent, intentionally dropped from the Hyprland set:
# window grouping (SUPER+G/ALT+group binds), pseudo-tiling (SUPER+P), the
# Hyprland universal-clipboard send_key trick, and moving a whole workspace
# between monitors (Mango tags are per-monitor).

var=terminal,uwsm app -- xdg-terminal-exec

# --- Applications ----------------------------------------------------------
bind=SUPER,Return,spawn_shell,$terminal --working-directory="$(kestrel-cmd-terminal-cwd)"
# SUPER+SHIFT+B is browser (private) on this machine; plain SUPER+B is in config.
bind=SUPER,SHIFT,B,spawn,kestrel-launch-browser --private
bind=SUPER,SHIFT,N,spawn,kestrel-launch-editor
bind=SUPER,SHIFT,F,spawn,uwsm app -- nautilus --new-window
bind=SUPER,CTRL,Q,spawn,qalculate-qt
bind=SUPER,SHIFT,W,spawn,zuno
bind=SUPER,T,spawn,$terminal -e btop

# --- Shell and menus -------------------------------------------------------
bind=SUPER,SPACE,spawn,kestrel-menu toggle
bind=SUPER,SHIFT,D,spawn,kestrel-menu toggle
bind=SUPER,CTRL,V,spawn,kestrel-menu-clipboard
bind=SUPER,CTRL,K,spawn,kestrel-menu-keybindings
bind=SUPER,ALT,K,spawn,kestrel-menu-tmux-keybindings

# --- Window management -----------------------------------------------------
# On this machine SUPER+W toggles floating (close is SUPER+SHIFT+Q in config).
bind=SUPER,W,togglefloating
bind=SUPER,Q,killclient
bind=SUPER+CTRL+ALT,Delete,spawn,kestrel-hyprland-window-close-all
bind=SUPER,T,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER+CTRL,F,togglemaximizescreen
bind=SUPER+ALT,F,togglemaximizescreen
bind=SUPER,J,dwindle_toggle_split_direction
bind=SUPER,L,switch_layout
bind=SUPER,O,togglefloating
bind=SUPER,ALT,Home,spawn,kestrel-hyprland-window-width save
bind=SUPER,Home,spawn,kestrel-hyprland-window-width restore

# --- Focus -----------------------------------------------------------------
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=SUPER,ALT,Tab,focusstack,next
bind=SUPER,ALT+SHIFT,Tab,focusstack,prev

# --- Move and swap ---------------------------------------------------------
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+ALT,Left,exchange_client,left
bind=SUPER+ALT,Right,exchange_client,right
bind=SUPER+ALT,Up,exchange_client,up
bind=SUPER+ALT,Down,exchange_client,down

# --- Monitors --------------------------------------------------------------
bind=CTRL+ALT,Tab,focusmon,next
bind=CTRL+ALT+SHIFT,Tab,focusmon,prev
bind=SUPER+SHIFT+ALT,Left,tagmon,left
bind=SUPER+SHIFT+ALT,Right,tagmon,right
bind=SUPER+SHIFT+ALT,Up,tagmon,up
bind=SUPER+SHIFT+ALT,Down,tagmon,down
bind=SUPER,slash,spawn,kestrel-hyprland-monitor-scaling up
bind=SUPER+ALT,slash,spawn,kestrel-hyprland-monitor-scaling down

# --- Tags (per-monitor, no synctag) ----------------------------------------
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT+ALT,1,tagsilent,1
bind=SUPER+SHIFT+ALT,2,tagsilent,2
bind=SUPER+SHIFT+ALT,3,tagsilent,3
bind=SUPER+SHIFT+ALT,4,tagsilent,4
bind=SUPER+SHIFT+ALT,5,tagsilent,5
bind=SUPER+SHIFT+ALT,6,tagsilent,6
bind=SUPER+SHIFT+ALT,7,tagsilent,7
bind=SUPER+SHIFT+ALT,8,tagsilent,8
bind=SUPER+SHIFT+ALT,9,tagsilent,9
bind=SUPER,Tab,viewtoright
bind=SUPER+SHIFT,Tab,viewtoleft
bind=SUPER+CTRL,Tab,view_insert,next

# --- Scratchpad ------------------------------------------------------------
# SUPER+S and SUPER+Y are rebound per-machine in config/mango/bindings.conf
# (named special workspaces and the scratchpad key), so they are not set here.
bind=SUPER,ALT,S,tag_special_silent
bind=SUPER,grave,toggle_special_tag
bind=SUPER+SHIFT,grave,tag_special_silent

# --- Window resize (SUPER + minus/equal keycodes) --------------------------
bind=SUPER,code:20,resizewin,-100,0
bind=SUPER,code:21,resizewin,100,0
bind=SUPER+SHIFT,code:20,resizewin,0,-100
bind=SUPER+SHIFT,code:21,resizewin,0,100
bind=SUPER+ALT,code:20,resizewin,-25,0
bind=SUPER+ALT,code:21,resizewin,25,0
bind=SUPER+SHIFT+ALT,code:20,resizewin,0,-25
bind=SUPER+SHIFT+ALT,code:21,resizewin,0,25

# --- Mouse -----------------------------------------------------------------
mousebind=SUPER,mouse:272,movewin
mousebind=SUPER,mouse:273,resizewin
axisbind=SUPER,up,viewtoleft
axisbind=SUPER,down,viewtoright

# --- Media, brightness, backlight ------------------------------------------
bindl=NONE,XF86AudioRaiseVolume,spawn,kestrel-audio-output-volume +5
bindl=NONE,XF86AudioLowerVolume,spawn,kestrel-audio-output-volume -5
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,kestrel-audio-input-mute
bindl=NONE,XF86MonBrightnessUp,spawn,kestrel-brightness-display +5%
bindl=NONE,XF86MonBrightnessDown,spawn,kestrel-brightness-display 5%-
bindl=SHIFT,XF86MonBrightnessUp,spawn,kestrel-brightness-display 100%
bindl=SHIFT,XF86MonBrightnessDown,spawn,kestrel-brightness-display 1%
bindl=NONE,XF86KbdBrightnessUp,spawn,kestrel-brightness-keyboard up
bindl=NONE,XF86KbdBrightnessDown,spawn,kestrel-brightness-keyboard down
bindl=NONE,XF86KbdLightOnOff,spawn,kestrel-brightness-keyboard cycle
bindl=NONE,XF86TouchpadOn,spawn,kestrel-toggle-touchpad on
bindl=NONE,XF86TouchpadOff,spawn,kestrel-toggle-touchpad off
bindl=ALT,XF86AudioRaiseVolume,spawn,kestrel-audio-output-volume +1
bindl=ALT,XF86AudioLowerVolume,spawn,kestrel-audio-output-volume -1
bindl=ALT,XF86MonBrightnessUp,spawn,kestrel-brightness-display +1%
bindl=ALT,XF86MonBrightnessDown,spawn,kestrel-brightness-display 1%-
bindl=SHIFT,XF86AudioMute,spawn,kestrel-audio-output-switch
bindl=SHIFT,XF86AudioPause,spawn,kestrel-audio-source-switch
bindl=SHIFT,XF86AudioPlay,spawn,kestrel-audio-source-switch

# --- Playback --------------------------------------------------------------
bindl=NONE,XF86AudioNext,spawn,playerctl -p spotify,zuno next
bindl=NONE,XF86AudioPrev,spawn,playerctl -p spotify,zuno previous
bindl=NONE,XF86AudioPlay,spawn,playerctl -p spotify,zuno play-pause
bindl=NONE,XF86AudioPause,spawn,playerctl -p spotify,zuno play-pause
bindl=ALT,XF86AudioPlay,spawn,playerctl -p spotify,zuno next
bindl=ALT+SHIFT,XF86AudioPlay,spawn,playerctl -p spotify,zuno previous
bindl=NONE,XF86Eject,spawn,eject

# --- Capture ---------------------------------------------------------------
bind=NONE,Print,spawn,kestrel screenshot

# --- Reload ----------------------------------------------------------------
# SUPER+r is the devdocs tag on this machine, so reload lives on SUPER+CTRL+r.
bind=SUPER+CTRL,r,reload_config
