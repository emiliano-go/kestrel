# Kestrel default Mango keybindings.
# Syntax: bind[flags]=MODIFIERS,KEY,DISPATCHER,PARAMETERS
# This is the M2 foundation; M3 completes the full Hyprland -> Mango parity set.

var=terminal,uwsm app -- xdg-terminal-exec

# Applications
bind=SUPER,Return,spawn,$terminal
bind=SUPER,SHIFT,B,spawn,kestrel-launch-browser
bind=SUPER,SHIFT,N,spawn,kestrel-launch-editor
bind=SUPER,SHIFT,F,spawn,uwsm app -- nautilus --new-window
bind=SUPER,CTRL,Q,spawn,qalculate-qt
bind=SUPER,SHIFT,W,spawn,zuno

# Shell and menus
bind=SUPER,SPACE,spawn,kestrel-menu toggle
bind=SUPER,D,spawn,kestrel-menu toggle
bind=SUPER,V,spawn,kestrel-menu-clipboard

# Window management
bind=SUPER,SHIFT,Q,killclient
bind=SUPER,W,togglefloating
bind=SUPER,SHIFT,F,togglefullscreen

# Focus and movement
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# Tags (per-monitor, no synctag)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

# Scratchpads
bind=SUPER,S,toggle_special_tag
bind=SUPER+SHIFT,S,tag_special_silent

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl -p spotify,zuno play-pause
bind=NONE,XF86AudioNext,spawn,playerctl -p spotify,zuno next
bind=NONE,XF86AudioPrev,spawn,playerctl -p spotify,zuno previous
bind=NONE,XF86MonBrightnessUp,spawn,kestrel-brightness-display +5%
bind=NONE,XF86MonBrightnessDown,spawn,kestrel-brightness-display 5%-

# Capture
bind,NONE,Print,spawn,kestrel screenshot

# Reload
bind=SUPER,r,reload_config
