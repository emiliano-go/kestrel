# Kestrel default Mango compositor configuration.
# See https://mangowm.github.io/docs/

# --- Environment -----------------------------------------------------------
# Cursor size.
env=XCURSOR_SIZE,24
env=HYPRCURSOR_SIZE,24

# Force applications onto Wayland.
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,gtk3
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland
env=XDG_SESSION_TYPE,wayland

# Session identity for portals and screensharing.
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango

# XCompose.
env=XCOMPOSEFILE,~/.XCompose

# --- Autostart -------------------------------------------------------------
# exec_once runs once when Mango starts.
exec_once=systemctl --user import-environment $(env | cut -d'=' -f 1)
exec_once=dbus-update-activation-environment --systemd --all
exec_once=kestrel-launch-shell
exec_once=kestrel-provision-first-run
exec_once=kestrel-powerprofiles-init
exec_once=udiskie --automount --no-notify --no-tray
exec_once=sleep 2 && kestrel-hook post-boot

# --- Defaults (keybindings, appearance, input) -----------------------------
source_optional=~/.local/share/kestrel/default/mango/bindings.conf
source_optional=~/.local/share/kestrel/default/mango/looknfeel.conf
source_optional=~/.local/share/kestrel/default/mango/input.conf
